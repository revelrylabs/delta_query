name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: test (elixir ${{ matrix.elixir }}, otp ${{ matrix.otp }}${{ matrix.explorer && ', explorer minimum' || '' }})
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.20"
            otp: "28"
            lint: true
          - elixir: "1.20"
            otp: "28"
            explorer: minimum
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.explorer }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.explorer }}-
      - name: Pin Explorer to minimum supported version
        if: matrix.explorer == 'minimum'
        run: |
          sed -i 's/{:explorer, "~> 0.10"}/{:explorer, "~> 0.10.0"}/' mix.exs
          grep -q '{:explorer, "~> 0.10.0"}' mix.exs
          mix deps.unlock --all
      - name: Install dependencies
        run: mix deps.get
      - name: Fetch Explorer NIF
        run: |
          version=$(sed -n 's/.*"explorer": {:hex, :explorer, "\([0-9.]*\)".*/\1/p' mix.lock)
          file="libexplorer-v${version}-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz"
          dir="$HOME/.cache/rustler_precompiled/precompiled_nifs"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$file" "https://github.com/elixir-nx/explorer/releases/download/v${version}/${file}"
      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted
      - name: Run Credo
        if: matrix.lint
        run: mix credo --strict
      - name: Run tests
        run: mix test
