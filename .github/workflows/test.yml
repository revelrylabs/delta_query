name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: test (elixir ${{ matrix.elixir }}, otp ${{ matrix.otp }}${{ matrix.explorer && ', explorer minimum' || '' }})
    runs-on: ubuntu-22.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported
          - elixir: "1.16"
            otp: "26"
          - elixir: "1.18"
            otp: "27"
          # Newest supported; formatting is only checked here
          - elixir: "1.20"
            otp: "28"
            lint: true
          # Lowest Explorer version allowed by mix.exs
          - elixir: "1.20"
            otp: "28"
            explorer: minimum
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.explorer }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ matrix.explorer }}-
      - name: Pin Explorer to minimum supported version
        if: matrix.explorer == 'minimum'
        run: |
          sed -i 's/{:explorer, "~> 0.10"}/{:explorer, "~> 0.10.0"}/' mix.exs
          grep -q '{:explorer, "~> 0.10.0"}' mix.exs
          mix deps.unlock --all
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted
      - name: Run tests
        run: mix test
        